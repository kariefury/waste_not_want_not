name: waste_not_want_not
description: A privacy-centric local food sharing app — share your pantry extras with neighbors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.19.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
